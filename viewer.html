<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hugo – visualizador</title>
    <style>
      body { background: #222; color: #ddd; font: 13px/1.4 monospace; margin: 12px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
      canvas { width: 960px; height: 720px; image-rendering: pixelated; background: #f0f; max-width: 100%; }
      select, input, button { font: inherit; }
      #files { height: 720px; width: 220px; }
      #sounds button { display: block; margin: 2px 0; }
      label { display: block; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div class="row">
      <select id="files" size="40"></select>
      <div>
        <label>Pasta <select id="folder"></select></label>
        <label>Paleta <select id="palette"></select></label>
        <label>Fundo <select id="bg"><option value="">(nenhum)</option></select> frame <input id="bgframe" type="number" value="0" min="0" style="width: 5em" /></label>
        <label>Frame <input id="frame" type="range" min="0" value="0" /> <span id="info"></span></label>
        <canvas id="screen" width="320" height="240"></canvas>
      </div>
      <div id="sounds"></div>
    </div>
    <script type="module" src="/src/dev/viewer.ts"></script>
  </body>
</html>
